# Models reachable through the OpenAI-compatible API at base_url.
#
# Auth headers are configured via env vars, never in this file:
#   MODEL_API_KEY         - default API key for base_url (required)
#   MODEL_{NAME}_API_KEY  - per-model API key override
#   MODEL_HEADERS         - extra default headers for every model
#   MODEL_{NAME}_HEADERS  - per-model overrides ({NAME} = model name,
#                           uppercased, non-alphanumerics replaced by "_")
# TODO(oss): replace internal endpoint with a placeholder before the repo
# goes public.
base_url: https://internal.devtest.truefoundry.tech/api/llm

models:
  - name: anthropic/claude-sonnet-4-6
    reasoning_efforts:
      - low
      - medium
      - high
    max_output_tokens: 32768

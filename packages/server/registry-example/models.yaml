# Each model declares its own provider so direct vendors and gateways can be
# mixed freely in the same registry.
#
# Auth — two ways to configure credentials (first match wins per model):
#
#   1. Inline api_key / headers in this file using ${ENV_VAR} substitution:
#        api_key: "${ANTHROPIC_API_KEY}"
#        headers:
#          Authorization: "Bearer ${MY_TOKEN}"
#      The server resolves the env var at startup. Missing vars raise an error.
#
#   2. Env var conventions (fallback when api_key is absent):
#        MODEL_API_KEY              — global default key for all models
#        MODEL_{NAME}_API_KEY       — per-model override
#        MODEL_HEADERS              — global extra headers
#        MODEL_{NAME}_HEADERS       — per-model header overrides
#        ({NAME} = model name uppercased, non-alphanumerics → "_")
#
# Supported providers:
#   First-party (Vercel AI SDK):  openai | anthropic | google | mistral
#   Named gateways (well-known base URL): openrouter | portkey | kimi
#   Compat (requires base_url): openai-compatible | litellm | truefoundry
#
# base_url is optional for first-party providers (overrides the default endpoint)
# and required for compat providers.
#
# openai_api selects the OpenAI API surface (openai provider only):
#   responses  - OpenAI Responses API (default); required for o-series reasoning models.
#                Enables store: false (no server-side storage) and retrieves
#                reasoning.encrypted_content for stateless multi-turn reasoning.
#   chat       - Chat Completions API; use for models or deployments that don't
#                support the Responses API.

models:
  # --- Direct Anthropic ---
  - name: claude-sonnet-4-6
    provider: anthropic
    api_key: "${ANTHROPIC_API_KEY}"
    max_output_tokens: 32768
    reasoning_efforts:
      - low
      - medium
      - high

  # --- Direct OpenAI (Chat Completions API) ---
  - name: gpt-4o
    provider: openai
    api_key: "${OPENAI_API_KEY}"
    openai_api: chat
    max_output_tokens: 16384

  # --- Direct OpenAI (Responses API — o-series reasoning models) ---
  - name: o4-mini
    provider: openai
    api_key: "${OPENAI_API_KEY}"
    openai_api: responses
    max_output_tokens: 32768
    reasoning_efforts:
      - low
      - medium
      - high

  - name: o3
    provider: openai
    api_key: "${OPENAI_API_KEY}"
    openai_api: responses
    max_output_tokens: 32768
    reasoning_efforts:
      - low
      - medium
      - high

  # --- Direct Google ---
  - name: gemini-2.5-flash
    provider: google
    api_key: "${GOOGLE_API_KEY}"
    max_output_tokens: 8192

  # --- OpenAI-compatible gateway (e.g. LiteLLM / TrueFoundry / any OpenAI-compat proxy) ---
  # openai_api defaults to 'chat' for compat providers; set 'responses' only if the
  # gateway exposes the OpenAI Responses API endpoint.
  - name: anthropic/claude-sonnet-4-6
    provider: openai-compatible
    api_key: "${LLM_GATEWAY_API_KEY}"
    base_url: https://your-gateway.example.com/api/llm
    max_output_tokens: 32768
    reasoning_efforts:
      - low
      - medium
      - high

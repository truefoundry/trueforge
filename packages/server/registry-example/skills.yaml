# Agent skills, each a directory with a SKILL.md in a public git repository.
#   url   - public git repository
#   path  - directory containing SKILL.md (optional, repo root if omitted)
#   ref   - branch, tag, or commit SHA to pin (optional, default branch if omitted)
#   description - concise guidance for when to use the skill
skills:
  - name: algorithmic-art
    url: https://github.com/anthropics/skills
    path: skills/algorithmic-art
    ref: main
    description: Creating algorithmic art using p5.js with seeded randomness and interactive parameter exploration.

# Shipped MCP catalog: server presets offered by
# GET /api/v1/catalog/mcp-servers for the UI to copy into
# PUT /api/v1/settings/mcp-servers bodies. Discovery-only — never executed against.
mcp_servers:
  - type: remote
    name: linear
    logo: https://assets.production.truefoundry.com/linear.svg
    url: https://mcp.linear.app/mcp
    description: Search, read, and create Linear issues.
    auth:
      type: dcr
  - type: remote
    name: notion
    logo: https://assets.production.truefoundry.com/notion.svg
    url: https://mcp.notion.com/mcp
    description: Search pages, read content, query databases, create pages.
    auth:
      type: dcr
  - type: remote
    name: sentry
    logo: https://assets.production.truefoundry.com/sentry.svg
    url: https://mcp.sentry.dev/mcp
    description: Search errors, read stack traces, and check releases.
    auth:
      type: dcr
  - type: remote
    name: deepwiki
    logo: https://assets.production.truefoundry.com/deepwiki.png
    url: https://mcp.deepwiki.com/mcp
    description: Read documentation and ask questions about any public GitHub repository.
  - type: remote
    name: exa
    logo: https://assets.production.truefoundry.com/exa.svg
    url: https://mcp.exa.ai/mcp
    description: Search the web, fetch page contents, and find similar pages.
  - type: remote
    name: parallel-web
    logo: https://assets.production.truefoundry.com/parallel-web.svg
    url: https://search.parallel.ai/mcp
    description: Search the web and get ranked results with extracted content.
  - type: remote
    name: github
    logo: https://assets.production.truefoundry.com/github.svg
    url: https://api.githubcopilot.com/mcp/
    description: Work with issues, pull requests, repository files, and CI status.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_GITHUB_PAT
  - type: remote
    name: tavily
    logo: https://assets.production.truefoundry.com/tavily.svg
    url: https://mcp.tavily.com/mcp
    description: Search the web, extract page content, and crawl sites.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_TAVILY_API_KEY
  - type: remote
    name: bright-data
    logo: https://assets.production.truefoundry.com/bright-data.png
    url: https://mcp.brightdata.com/mcp
    description: Search the web and scrape pages, including sites behind bot protection.
    auth:
      type: header
      headers:
        Authorization: Bearer YOUR_BRIGHT_DATA_API_TOKEN
  - type: remote
    name: supabase
    logo: https://assets.production.truefoundry.com/supabase.svg
    url: https://mcp.supabase.com/mcp
    description: Run SQL queries, manage tables, and inspect Supabase projects.
    auth:
      type: dcr
  - type: remote
    name: stripe
    logo: https://assets.production.truefoundry.com/stripe.svg
    url: https://mcp.stripe.com
    description: Create and manage customers, payments, invoices, and subscriptions.
    auth:
      type: dcr
  - type: remote
    name: confluence
    logo: https://assets.production.truefoundry.com/confluence.svg
    url: https://mcp.atlassian.com/v1/mcp
    description: Search spaces, read pages, and create or update content.
    auth:
      type: dcr
  - type: remote
    name: jira
    logo: https://assets.production.truefoundry.com/jira.png
    url: https://mcp.atlassian.com/v1/mcp
    description: Search, read, create, and update Jira issues.
    auth:
      type: dcr
  - type: remote
    name: posthog
    logo: https://assets.production.truefoundry.com/posthog.svg
    url: https://mcp.posthog.com/mcp
    description: Query product analytics, run SQL, and manage feature flags.
    auth:
      type: dcr

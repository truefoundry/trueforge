# Minimal Lima guest for local-sandbox Linux SRT smoke.
# Mounts the workspace root at the same absolute host path.
cpus: 1
memory: '2GiB'
disk: '20GiB'

images:
  - location: 'https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img'
    arch: 'aarch64'
  - location: 'https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img'
    arch: 'x86_64'

# `location` is rewritten to an absolute host path by smoke-lima.sh
mounts:
  - location: '__LOCAL_SANDBOX_ROOT__'
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      # Ubuntu 24.04 blocks capability-bearing user namespaces by default; SRT/bwrap needs them.
      if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        printf '%s\n' 'kernel.apparmor_restrict_unprivileged_userns=0' \
          >/etc/sysctl.d/99-local-sandbox-userns.conf
      fi
      apt-get update -y
      apt-get install -y --no-install-recommends \
        bubblewrap \
        socat \
        ripgrep \
        python3 \
        python3-pip \
        python3-setuptools \
        ca-certificates \
        curl \
        gnupg
      if ! command -v node >/dev/null 2>&1; then
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y --no-install-recommends nodejs
      fi
      corepack enable
      corepack prepare pnpm@9.15.9 --activate

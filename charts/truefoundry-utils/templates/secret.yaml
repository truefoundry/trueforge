{{- /*
Rendered only for external Postgres with a literal password and no existingSecret.
The bundled postgresql subchart manages its own Secret.
*/ -}}
{{- if and (not .Values.postgresql.enabled) .Values.externalPostgres.password (not .Values.externalPostgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres" (include "truefoundry-utils.fullname" .) }}
  labels:
    {{- include "truefoundry-utils.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.externalPostgres.passwordKey }}: {{ .Values.externalPostgres.password | quote }}
{{- end }}

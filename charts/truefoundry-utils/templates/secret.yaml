{{- /*
Chart-owned Secrets for sensitive literal values (not valueFrom maps).
Bundled postgresql subchart manages its own Secret.
*/ -}}
{{- $postgresSecret := and (not .Values.postgresql.enabled) (eq (include "truefoundry-utils.isLiteralString" (dict "value" .Values.externalPostgres.password)) "true") }}
{{- $oidcSecret := and .Values.configs.oidc.enabled (eq (include "truefoundry-utils.isLiteralString" (dict "value" .Values.configs.oidc.clientSecret)) "true") }}
{{- if $postgresSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres" (include "truefoundry-utils.fullname" .) }}
  labels:
    {{- include "truefoundry-utils.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.externalPostgres.password | quote }}
{{- end }}
{{- if and $postgresSecret $oidcSecret }}
---
{{- end }}
{{- if $oidcSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truefoundry-utils.oidc.secretName" . }}
  labels:
    {{- include "truefoundry-utils.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.configs.oidc.clientSecret | quote }}
{{- end }}

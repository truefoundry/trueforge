{{- $artifacts := .Values.artifacts | default dict -}}
{{- $secretName := printf "%s-artifact-signing" (include "trueforge.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := $artifacts.signingKey | default "" -}}
{{- if not $key -}}
{{- if and $existing $existing.data $existing.data.key -}}
{{- $key = index $existing.data "key" | b64dec -}}
{{- else -}}
{{- $key = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "trueforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ $key | quote }}

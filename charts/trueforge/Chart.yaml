apiVersion: v2
name: trueforge
description: TrueForge server (API + UI) served from a single container image.
type: application
# version (chart) and appVersion are stamped from the release tag by
# .github/workflows/release.yml; the committed values are the last release.
version: 0.0.1
appVersion: "0.0.1"
kubeVersion: ">=1.25.0-0"
home: https://github.com/truefoundry/trueforge
sources:
  - https://github.com/truefoundry/trueforge
maintainers:
  - name: TrueFoundry
    url: https://truefoundry.com
# Postgres and Redis ship as optional bundled dependencies (Bitnami charts from
# the TrueFoundry JFrog OCI mirror). Disable either to use an external service
# via externalPostgres / externalRedis.
dependencies:
  - name: postgresql
    version: "18.1.14"
    repository: "oci://tfy.jfrog.io/tfy-mirror/bitnamicharts"
    condition: postgresql.enabled
  - name: redis
    version: "21.2.19"
    repository: "oci://tfy.jfrog.io/tfy-mirror/bitnamicharts"
    condition: redis.enabled

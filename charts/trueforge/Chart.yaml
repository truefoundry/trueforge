apiVersion: v2
name: trueforge
description: TrueForge server (API + UI) served from a single container image.
type: application
# version (chart) and appVersion are stamped from the release tag by
# .github/workflows/release.yml; the committed values are the last release.
version: 0.0.1
appVersion: "0.0.1"
kubeVersion: ">=1.25.0-0"
home: https://github.com/truefoundry/trueforge
sources:
  - https://github.com/truefoundry/trueforge
maintainers:
  - name: TrueFoundry
    url: https://truefoundry.com
# Postgres and Redis ship as optional bundled dependencies. The Bitnami
# subcharts are vendored under charts/ (no repository field), matching the
# convention in truefoundry/helm-charts, so packaging needs no registry access.
# Disable either to use an external service via externalPostgres / externalRedis.
dependencies:
  - name: postgresql
    version: "16.7.27"
    condition: postgresql.enabled
  - name: redis
    version: "24.0.0"
    condition: redis.enabled

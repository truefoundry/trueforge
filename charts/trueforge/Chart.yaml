apiVersion: v2
name: trueforge
description: TrueForge server (API + UI) served from a single container image.
type: application
# version is written verbatim from release-chart.yml's chart_version input;
# nothing in this repo computes it. The caller decides the number, and it need
# not match the parent chart's own version.
# appVersion follows packages/trueforge/package.json and image.tag follows the
# image release.yml built. All three are written on the release-vX.Y.Z branch,
# which is then tagged charts/trueforge@<version> on that commit.
version: "0.3.0"
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
home: https://truefoundry.com
sources:
  - https://truefoundry.com
maintainers:
  - name: TrueForge
    url: https://truefoundry.com
# Postgres and Redis ship as optional bundled dependencies, pulled from the
# public Bitnami OCI chart archive at build time (`helm dependency build`, pinned
# via Chart.lock). The charts are still public, but the container images they
# reference moved to docker.io/bitnamilegacy; values.yaml points those at the
# TrueFoundry JFrog mirror. Disable either to use an external service via
# externalPostgres / externalRedis.
dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: "24.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  # Dev sandbox server, deployed only when a parent chart enables it.
  - name: tfy-sandbox-server
    version: "0.3.4"
    repository: oci://tfy.jfrog.io/tfy-helm
    condition: truefoundry.devSandboxServerEnabled
    alias: tfy-sandbox-server

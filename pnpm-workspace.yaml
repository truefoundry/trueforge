packages:
  - packages/*
  # Out of the workspace: its generated devDeps would break --frozen-lockfile in CI.
  - '!packages/sdk'

minimumReleaseAge: 0
trustLockfile: true
confirmModulesPurge: false
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true

# Silence peer mismatches between agent-ui-sdk peers and the versions we pin.
peerDependencyRules:
  allowedVersions:
    '@truefoundry/assistant-ui-runtime': '0.1.6-rc.2'

# One Context module for assistant-ui (avoids "requires an AuiProvider").
overrides:
  '@assistant-ui/store': '0.2.21'
  '@assistant-ui/core': '0.2.22'
  # resolve@1.22.12 ships accidental .claude/ files that break installs under macOS sandbox.
  resolve: '1.22.11'

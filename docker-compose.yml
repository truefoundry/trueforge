# Full-stack smoke test. Reads packages/trueforge/.env for secrets and
# credentials; host ports and in-network DB/Redis targets are opinionated here
# so they do not collide with or inherit host-dev values.
name: trueforge

services:
  postgres:
    image: postgres:17
    env_file:
      - path: packages/trueforge/.env
        required: true
    # Host 5433 avoids conflict with docker-compose.dev.yml on 5432.
    ports:
      - '5433:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Shared by all server replicas: carries executor peering (cross-replica
  # turn cancel via request-reply).
  redis:
    image: redis:7-alpine
    # Host 6380 avoids conflict with docker-compose.dev.yml on 6379.
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Serves both the API and the UI on one port.
  server:
    build:
      context: .
      # From-source image; root Dockerfile is the npm-install prod recipe.
      dockerfile: Dockerfile.dev
    image: truefoundry-server:latest
    ports:
      # Host 8791 avoids conflict with host `pnpm dev` on 8790.
      - '8791:8790'
    environment:
      # Wins over env_file / image defaults so a host .env cannot flip this.
      NODE_ENV: production
      # Inside the container; host mapping above is 8791.
      PORT: 8790
      # Host-facing origin for MCP OAuth callbacks (mapped port, not container PORT).
      PUBLIC_BASE_URL: http://localhost:8791
      # Compose network hosts — do not use packages/trueforge/.env localhost values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Compose runs one replica but keeps peering on so the peered cancel path
      # stays exercised. STANDALONE=false ⇒ Postgres + Redis.
      # A single-process deployment can set STANDALONE=true and drop redis.
      STANDALONE: 'false'
      REDIS_URL: redis://redis:6379
    # Secrets and Postgres credentials (POSTGRES_USER, …).
    # `environment` above overrides any colliding keys from this file.
    env_file:
      - path: packages/trueforge/.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Probes GET /healthz; node is already in the image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Above the app's default GRACEFUL_TIMEOUT_SECONDS (30) so SIGKILL does not
    # cut off turn drain.
    stop_grace_period: 35s
    restart: unless-stopped

  # Schedule controller: runs the periodic control loops (schedule dispatch) as a separate service.
  controller:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: truefoundry-server:latest
    command: ['node', 'dist/controller-main.js']
    environment:
      NODE_ENV: production
      STANDALONE: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # The controller is its own container, so localhost would be itself; `server` is
      # the compose DNS name that resolves to the server container.
      SERVER_URL: http://server:8790
    env_file:
      - path: packages/trueforge/.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    # Above GRACEFUL_TIMEOUT_SECONDS (30) so SIGKILL does not cut off loop drain.
    stop_grace_period: 35s
    restart: unless-stopped

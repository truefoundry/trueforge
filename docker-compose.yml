services:
  postgres:
    image: postgres:17
    env_file:
      - path: packages/server/.env
        required: true
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Shared by all server replicas: carries executor peering (cross-replica
  # turn cancel via request-reply).
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: truefoundry-server:latest
    ports:
      - '${PORT:-8790}:8790'
    environment:
      # PORT the server listens on inside the container (defaults to 8790).
      PORT: 8790
      # Compose network hostname; credentials still come from env_file.
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    # Environment variables (MODEL_API_KEY, POSTGRES_*, etc.) are read from this file.
    # Copy packages/server/.env.example to packages/server/.env and fill it in.
    env_file:
      - path: packages/server/.env
        required: true
    # The YAML registry (models.yaml, mcp.yaml, skills.yaml) is not baked into
    # the image. Copy registry-example to registry before starting the service.
    volumes:
      - ./packages/server/registry:/app/packages/server/registry:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Probes existing GET / (plain text OK!); node is already in the image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Above the app's default GRACEFUL_TIMEOUT_SECONDS (30) so SIGKILL does not
    # cut off turn drain.
    stop_grace_period: 35s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    image: truefoundry-frontend:latest
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

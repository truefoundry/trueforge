# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
#
# openapi/openapi.json is committed by `pnpm openapi:write`, so Fern never needs the server.
readme:
  apiName: TrueForge
  introduction: >
    API client for the TrueForge Agent Harness Server: a self-hosted runtime
    that executes agent turns and streams them over Server-Sent Events.


    When auth is enabled on the server, pass an ID token via the optional
    `token` client option (`Authorization: Bearer`).
  apiReferenceLink: https://trueforge.dev/api/use-agent
  # Fern keys this lookup on the stream flag, so the string form misses and fails.
  defaultEndpoint:
    method: POST
    path: /api/v1/sessions/{session_id}/turns
    stream: true
api:
  specs:
    - openapi: openapi/openapi.json
      settings:
        title-as-schema-name: false
        prefer-undiscriminated-unions-with-literals: true
        only-include-referenced-schemas: true
        type-dates-as-strings: true
        object-query-parameters: true
        idiomatic-request-names: true
        respect-nullable-schemas: true
        wrap-references-to-nullable-in-optional: false
        coerce-optional-schemas-to-nullable: false
        inline-path-parameters: false
        coerce-enums-to-literals: true
        respect-forward-compatible-enums: true
groups:
  # `local-file-system` allows no `github` block, so the workflow commits the result itself.
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.107.6
        output:
          location: local-file-system
          path: ../../packages/trueforge-sdk
        config:
          allowCustomFetcher: true
          allowExtraFields: true
          # Map query params (OpenAPI additionalProperties) as deepObject brackets, not JSON strings.
          deepObjectMapQueryParameters: true
          enableInlineTypes: false
          fetchSupport: native
          fileResponseType: binary-response
          formDataSupport: Node18
          includeApiReference: true
          inlineFileProperties: true
          inlinePathParameters: true
          naming:
            client: TrueForge
            namespace: TrueForge
          noSerdeLayer: false
          omitUndefined: true
          optional-auth: true
          outputEsm: true
          packageJson:
            author: TrueForge
            bugs:
              url: https://github.com/truefoundry/trueforge/issues
            engines:
              node: '>=22'
            # Opt-in via --conditions=trueforge-dev / customConditions. Never
            # name this "development" (Vite/webpack auto-activate; src/ unpublished).
            # Types stay on sdk:types .d.mts (src is not exactOptionalPropertyTypes-clean).
            exports:
              '.':
                'trueforge-dev':
                  # `types` must precede `default` (exports key order is match priority).
                  types: './dist/esm/index.d.mts'
                  default: './src/index.ts'
            homepage: https://github.com/truefoundry/trueforge/tree/main/packages/trueforge-sdk#readme
            license: MIT
            name: '@truefoundry/trueforge-sdk'
            publishConfig:
              access: public
              provenance: true
            repository:
              directory: packages/trueforge-sdk
              type: git
              url: git+https://github.com/truefoundry/trueforge.git
          # Deep-merge so we only add trueforge-dev without replacing Fern's exports.
          packageJsonMergeStrategy: deep
          requireBaseUrl: true
          retainOriginalCasing: false
          skipResponseValidation: true
          streamType: web
          useDefaultRequestParameterValues: true
        smart-casing: true
  # `local-file-system` allows no `github` block, so the workflow commits the result itself.
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.41.7
        output:
          location: local-file-system
          path: ../../python/trueforge_sdk
        config:
          client:
            class_name: BaseTrueForge
            exported_class_name: TrueForge
            exported_filename: client.py
            filename: base_client.py
          inline_path_params: true
          optional_auth: true
          # Import + upload name. pip install trueforge-sdk resolves via PEP 503.
          package_name: trueforge_sdk
          pydantic_config:
            enum_type: forward_compatible_python_enums
            frozen: false
            skip_validation: true
          pyproject_python_version: '>=3.10'
          stream_abstraction: true
          use_request_defaults: all
        smart-casing: true

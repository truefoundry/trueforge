name: Bug report
description: Something isn't working as expected
labels: ['bug', 'needs-maintainer-attention']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do not report security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx @truefoundry/trueforge`
        2. Open Settings → ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running TrueForge?
      options:
        - npx (standalone / SQLite)
        - Docker Compose
        - Kubernetes (Helm)
        - From source
        - As a library (@truefoundry/trueforge-core)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.2.0, or a commit SHA if running from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Server logs, browser console output, or screenshots. Redact secrets.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node.js version:
        Browser (if UI-related):

name: Feature request
description: Suggest an idea or improvement
labels: ['enhancement', 'needs-maintainer-attention']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — links, sketches, related issues.

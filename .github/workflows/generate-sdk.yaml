name: Generate SDK

# Regenerates the OpenAPI document and the SDK, and commits both to the branch.
on:
  push:
    branches: [main]
    # Only sources the document is built from; tests and metadata cannot change it.
    paths:
      - 'packages/server/src/**'
      - 'packages/server/scripts/**'
      - 'packages/harness/src/**'
      - '.github/fern/**'
      - '.github/workflows/generate-sdk.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/server/src/**'
      - 'packages/server/scripts/**'
      - 'packages/harness/src/**'
      - '.github/fern/**'
      - '.github/workflows/generate-sdk.yaml'

concurrency:
  group: generate-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate OpenAPI and TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A pull_request path filter matches the whole PR, not just the new commit,
    # so this job's own commits would otherwise retrigger it indefinitely.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      # Branch tip, not the merge commit, so output can be pushed back; forks need the head repo named.
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          # Full history, so the gate below can diff against the base commit.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The spec script imports @truefoundry/trueforge-core from its build output.
      - name: Build trueforge-core
        run: pnpm --filter @truefoundry/trueforge-core build

      - name: Write OpenAPI document
        run: pnpm --filter @truefoundry/trueforge openapi:write

      # Generation and its Docker pull are the slow part, so skip everything below
      # when neither the document nor the generator config moved.
      - name: Decide whether the SDK needs regenerating
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          reason=""
          if [ -n "$(git status --porcelain -- .github/fern/openapi/openapi.json)" ]; then
            reason="the OpenAPI document changed"
          elif ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            # A branch's first push reports an all-zero base commit.
            reason="there is no base commit to compare against"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- .github/fern/generators.yml .github/fern/fern.config.json; then
            reason="the generator config changed"
          fi

          if [ -n "$reason" ]; then
            echo "Regenerating: $reason."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: the OpenAPI document and generator config are unchanged."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Same entrypoint as local `pnpm sdk:generate` (re-runs openapi:write; idempotent).
      - name: Generate OpenAPI document and TypeScript SDK
        if: steps.decide.outputs.needed == 'true'
        run: pnpm sdk:generate

      # Forks get a read-only token, so only the commit is skipped. TODO: an approval flow that can push to the fork.
      - name: Commit generated output
        if: steps.decide.outputs.needed == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        # Passed as env, never interpolated into the script, so it cannot inject shell.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # --porcelain, not `git diff`, so new files count too.
          if [ -z "$(git status --porcelain -- .github/fern/openapi packages/sdk pnpm-lock.yaml)" ]; then
            echo "OpenAPI document and SDK are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bot-authored sdk diffs need a changeset; the PR author never touches this commit.
          # Skip packages/sdk/.fern — Fern metadata only, not a consumer-facing change.
          # changeset:sdk-regen is a no-op if the sdk is already named in a pending file.
          if [ -n "$(git status --porcelain -- packages/sdk ':!packages/sdk/.fern')" ]; then
            pnpm changeset:sdk-regen
          fi

          git add .github/fern/openapi packages/sdk pnpm-lock.yaml .changeset
          git commit -m "Regenerate OpenAPI document and TypeScript SDK"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Report skipped commit on fork
        if: steps.decide.outputs.needed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Generation succeeded. The commit was skipped because pull requests from forks cannot push; a maintainer will regenerate after merge."

name: Generate SDK

# Regenerates fern/openapi/openapi.json from the server's route definitions and
# the TypeScript SDK in packages/sdk, then commits both to the branch that
# triggered the run.
#
# `packages/harness` is in the trigger paths because the request/response
# schemas the spec is built from live there, not only in packages/server.
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/harness/**'
      - 'fern/**'
      - '.github/workflows/generate-sdk.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/server/**'
      - 'packages/harness/**'
      - 'fern/**'
      - '.github/workflows/generate-sdk.yaml'

concurrency:
  group: generate-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate OpenAPI and TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Check out the branch tip rather than the PR merge commit, so the
      # generated output can be committed back onto the branch.
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The spec script imports @truefoundry/utils from its build output.
      - name: Build utils
        run: pnpm --filter @truefoundry/utils build

      - name: Write OpenAPI document
        run: pnpm --filter @truefoundry/server openapi:write

      # Pinned to the version in fern/fern.config.json so CI and local runs
      # generate identical output.
      - name: Install Fern
        run: npm install -g fern-api@5.82.0

      - name: Check API is valid
        run: fern check

      # Runs the generator image on this runner instead of Fern's infrastructure.
      # `local-file-system` output only includes a package manifest when Fern sets
      # generateFullProject, and remote runs derive that solely from the org's
      # selfHostedSDKs entitlement, which is off for `truefoundry` — a remote run
      # returns loose source files with no package.json. Locally the flag is
      # `generateTests || selfHostedSDKs`, so --generate-tests gets us the full
      # package without depending on an entitlement Fern controls.
      - name: Generate TypeScript SDK
        run: fern generate --group ts-sdk --version 0.0.0 --local --generate-tests --log-level debug

      # Guards the invariant above: if the output ever loses its manifest, fail
      # rather than commit a package that cannot be built or published.
      - name: Verify the SDK is a complete package
        run: |
          set -euo pipefail

          missing=()
          for file in package.json tsconfig.json src/index.ts; do
            [ -e "packages/sdk/$file" ] || missing+=("$file")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Fern emitted source files without a package manifest (missing: ${missing[*]}). Check that the generate step still passes --local --generate-tests."
            exit 1
          fi

      # Pull requests from forks get a read-only token, so the commit is skipped
      # there; generation above still runs and fails the check on a bad spec.
      - name: Commit generated output
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail

          # --porcelain (not `git diff`) so the first run, where packages/sdk is
          # still untracked, is recognised as a change.
          if [ -z "$(git status --porcelain -- fern/openapi packages/sdk)" ]; then
            echo "OpenAPI document and SDK are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/openapi packages/sdk
          git commit -m "Regenerate OpenAPI document and TypeScript SDK"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"

      - name: Report skipped commit on fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Generation succeeded. The commit was skipped because pull requests from forks cannot push; a maintainer will regenerate after merge."

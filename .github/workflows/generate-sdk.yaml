name: Generate SDK

# Regenerates the OpenAPI document and the SDK, and commits both to the branch.
on:
  push:
    branches: [main]
    # Only sources the document is built from; tests and metadata cannot change it.
    paths:
      - 'packages/server/src/**'
      - 'packages/server/scripts/**'
      - 'packages/harness/src/**'
      - 'fern/**'
      - '.github/workflows/generate-sdk.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/server/src/**'
      - 'packages/server/scripts/**'
      - 'packages/harness/src/**'
      - 'fern/**'
      - '.github/workflows/generate-sdk.yaml'

concurrency:
  group: generate-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate OpenAPI and TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Branch tip, not the merge commit, so output can be pushed back; forks need the head repo named.
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The spec script imports @truefoundry/utils from its build output.
      - name: Build utils
        run: pnpm --filter @truefoundry/utils build

      - name: Write OpenAPI document
        run: pnpm --filter @truefoundry/server openapi:write

      # Pinned in one place so CI and local runs agree; bumps come from upgrade-sdk-toolchain.yaml.
      - name: Install Fern
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)"

      - name: Check API is valid
        run: fern check

      # `--generate-tests` is the only thing that makes Fern emit a full package rather than loose sources.
      - name: Generate TypeScript SDK
        run: fern generate --group ts-sdk --version 0.0.0 --local --generate-tests --log-level debug

      # Fern generates no CI for this output mode, so this is what proves the SDK compiles.
      - name: Verify the generated SDK builds
        working-directory: packages/sdk
        run: bash .fern/verify.sh

      # Forks get a read-only token, so only the commit is skipped. TODO: an approval flow that can push to the fork.
      - name: Commit generated output
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # Passed as env, never interpolated into the script, so it cannot inject shell.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # --porcelain, not `git diff`, so new files count too.
          if [ -z "$(git status --porcelain -- fern/openapi packages/sdk)" ]; then
            echo "OpenAPI document and SDK are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/openapi packages/sdk
          git commit -m "Regenerate OpenAPI document and TypeScript SDK"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Report skipped commit on fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Generation succeeded. The commit was skipped because pull requests from forks cannot push; a maintainer will regenerate after merge."

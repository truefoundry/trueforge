name: Generate SDK

# Push to main only. Pull requests are checked by ci.yml (sdk-check) and do not push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only sources the document is built from; tests and metadata cannot change it.
    paths:
      - 'packages/trueforge/src/**'
      - 'packages/trueforge/scripts/**'
      - 'packages/trueforge-core/src/**'
      - '.github/fern/**'
      - '.github/workflows/generate-sdk.yaml'
      - 'scripts/generate-sdk.sh'

concurrency:
  group: generate-sdk-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    name: Generate OpenAPI and SDKs
    runs-on: ubuntu-latest
    environment: trueforge-internal
    timeout-minutes: 30
    # Bot pushes from this workflow would otherwise re-enter forever.
    # github-actions[bot]: legacy GITHUB_TOKEN pushes
    # trueforge-dev-bot[bot]: App-token pushes from this workflow (slug of the Generate SDK App).
    if: >
      github.actor != 'github-actions[bot]' &&
      github.actor != 'trueforge-dev-bot[bot]'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI document and SDKs
        run: pnpm sdk:generate

      - name: Decide whether generated output changed
        id: dirty
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- .github/fern/openapi docs/openapi.json packages/trueforge-sdk python/trueforge_sdk pnpm-lock.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenAPI document and SDKs are already up to date."
          fi

      - name: Join the tailnet for GitHub egress
        if: steps.dirty.outputs.changed == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_CI_CLIENT_ID }}
          audience: ${{ secrets.TS_CI_AUDIENCE }}
          tags: tag:ci-github-egress
          hostname: gh-trueforge-sdk-${{ github.run_id }}

      - id: app-token
        if: steps.dirty.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit generated output
        if: steps.dirty.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          # Bot-authored sdk diffs need a changeset; the PR author never touches this commit.
          # Skip packages/trueforge-sdk/.fern — Fern metadata only, not a consumer-facing change.
          if [ -n "$(git status --porcelain -- packages/trueforge-sdk ':!packages/trueforge-sdk/.fern')" ]; then
            pnpm changeset:sdk-regen
          fi

          git add .github/fern/openapi docs/openapi.json packages/trueforge-sdk python/trueforge_sdk pnpm-lock.yaml .changeset
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::SDK commit left files outside the generated paths"
            git status --porcelain
            exit 1
          fi
          git commit -m "Regenerate OpenAPI document and SDKs"
          git push origin "HEAD:refs/heads/${BRANCH}"

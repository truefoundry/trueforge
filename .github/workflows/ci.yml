name: Build, Lint and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:ci

      - name: Test
        run: pnpm test

  postgres-store-tests:
    name: Postgres Session Store Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proto
          POSTGRES_PASSWORD: proto
          POSTGRES_DB: proto
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U proto -d proto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Detect session-store path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            store:
              - 'packages/server/src/db/**'
              - 'packages/server/tsup.config.ts'
              - 'packages/server/tests/**'
              - 'packages/server/jest.store.postgres.config.cjs'
              - 'packages/harness/src/agent-session/**'
              - 'packages/harness/tests/agent-session/**'

      - name: Skip — no session-store changes
        if: steps.filter.outputs.store != 'true'
        run: echo "No session-store paths changed; skipping Postgres store tests."

      - name: Setup pnpm
        if: steps.filter.outputs.store == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.filter.outputs.store == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.filter.outputs.store == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.store == 'true'
        run: pnpm build

      - name: Postgres session store contract tests
        if: steps.filter.outputs.store == 'true'
        env:
          SESSION_STORE_TEST_PG_URL: postgres://proto:proto@localhost:55432/proto
        run: pnpm --dir packages/server test:store:postgres

  sqlite-store-tests:
    name: SQLite Session Store Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Detect session-store path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            store:
              - 'packages/server/src/db/**'
              - 'packages/server/tsup.config.ts'
              - 'packages/server/tests/**'
              - 'packages/server/jest.store.sqlite.config.cjs'
              - 'packages/harness/src/agent-session/**'
              - 'packages/harness/tests/agent-session/**'
              - 'pnpm-workspace.yaml'

      - name: Skip — no session-store changes
        if: steps.filter.outputs.store != 'true'
        run: echo "No session-store paths changed; skipping SQLite store tests."

      - name: Setup pnpm
        if: steps.filter.outputs.store == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.filter.outputs.store == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.filter.outputs.store == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.store == 'true'
        run: pnpm build

      - name: SQLite session store contract tests
        if: steps.filter.outputs.store == 'true'
        run: pnpm --dir packages/server test:store:sqlite

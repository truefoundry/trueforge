name: Scan and Generate Grype Report

on:
  # Temporary: remove after first successful run
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 9 * * *'

permissions: {}

jobs:
  resolve:
    name: Resolve APP_VERSION
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.app.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7
      - id: app
        run: |
          APP_VERSION=$(yq -r '.appVersion' charts/trueforge/Chart.yaml)
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  image-scan:
    name: Image Vulnerability Scan
    needs: [resolve]
    # The shared workflow declares contents write, so the caller must grant at least that.
    # No pull-requests scope on purpose: the ignore-list PR is not wanted here.
    permissions:
      contents: write
    uses: truefoundry/github-workflows-public/.github/workflows/update-grype-report.yml@main
    with:
      dockerfile_path: 'Dockerfile'
      image_artifact_name: 'trueforge'
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      # Single-line on purpose: the called workflow passes this through toJSON,
      # so a block scalar's trailing newline would leak into the build arg.
      image_build_args: APP_VERSION=${{ needs.resolve.outputs.app_version }}

  # The shared workflow writes JSON for the ignore-list PR and does not publish it.
  # This job scans the same image to SARIF so findings land in Security > Code scanning.
  upload-grype:
    name: Upload Grype results
    needs: [resolve]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          load: true
          file: Dockerfile
          context: .
          platforms: linux/amd64
          provenance: false
          tags: trueforge:grype-report
          build-args: APP_VERSION=${{ needs.resolve.outputs.app_version }}

      - name: Scan image
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: trueforge:grype-report
          fail-build: false
          output-format: sarif
          # Include every severity. fail-build is off, so findings are reported, not gating.
          severity-cutoff: negligible

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-trueforge

name: Sync commit to trueforge-devtest-deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-devtest
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Pin SHA and push
    uses: ./.github/workflows/custom-runners/deploy-devtest.yml@main
    permissions:
      contents: read
    secrets: inherit
    with:
      sha: ${{ github.sha }}
      branch: ${{ github.ref_name }}

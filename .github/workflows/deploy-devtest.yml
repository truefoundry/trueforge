name: Sync commit to trueforge-devtest-deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-devtest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Pin SHA and push
    runs-on: ubuntu-latest
    # Replaces the workflow-level `contents: read` for this job, so it has to be
    # restated alongside id-token, which is the OIDC token Tailscale exchanges.
    permissions:
      contents: read
      id-token: write
    steps:
      # FIRST STEP, DELIBERATELY. Every GitHub call below is made with a GitHub
      # App installation token, and an App token is filtered by the org IP allow
      # list -- which a hosted runner's ephemeral address is not on. Joining the
      # tailnet routes this job's GitHub traffic through the app connector, so
      # GitHub sees the connector's allow-listed IP instead.
      #
      # The very next step is the first such call, so joining any later is too
      # late. Do not move this below app-token.
      #
      # The credential is pinned three ways on the Tailscale side
      # (truefoundry/tailscale-platform, terraform/tailnet/default.auto.tfvars):
      # this repo, refs/heads/main, and THIS workflow file. A dispatch from
      # another branch, or this step copied into another workflow, gets a 403.
      #
      # tag:ci-github-egress reaches the connector and nothing else in the
      # tailnet -- no cluster. Traffic to anything outside the connector's domain
      # list (Artifactory, ECR, npm) is not routed and still goes direct.
      - name: Join the tailnet for GitHub egress
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ vars.TS_CI_DEVTEST_CLIENT_ID }}
          audience: ${{ vars.TS_CI_DEVTEST_AUDIENCE }}
          tags: tag:ci-github-egress
          hostname: gh-trueforge-devtest-${{ github.run_id }}

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}
          owner: truefoundry
          repositories: trueforge-devtest-deployment

      - uses: actions/checkout@v7
        with:
          repository: truefoundry/trueforge-devtest-deployment
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Pin trueforge SHA and push
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          for f in trueforge.truefoundry.yaml trueforge-controller.truefoundry.yaml trueforge-clone-tfy-sandbox.truefoundry.yaml; do
            yq -i '
              .image.build_source.ref = strenv(SHA) |
              .image.build_source.branch_name = strenv(BRANCH)
            ' "$f"
          done

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add trueforge.truefoundry.yaml trueforge-controller.truefoundry.yaml trueforge-clone-tfy-sandbox.truefoundry.yaml
          if git diff --cached --quiet; then
            echo "Already pinned at $SHA"
            exit 0
          fi
          git commit -m "chore: pin trueforge@${SHA}"
          git push
          echo "Pinned trueforge@\`$SHA\` on main" >> "$GITHUB_STEP_SUMMARY"

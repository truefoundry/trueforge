# npm publish for the four public packages, plus PyPI for python/trueforge_sdk.
#
# npm and PyPI trusted publishers are bound to this filename (`release.yml`).
# Do not rename it without updating every package on npmjs.com and PyPI.
#
# Releases run on release-vX.Y.Z, not main. main only collects changesets.
#
# helm-charts dispatches this workflow with tfy_chart_version (X.Y.Z or
# X.Y.Z-rc.N) on ref release-vX.Y.Z. That run prepares pre mode and any
# 0.0.0 packages, runs changeset version, and auto-merges the Version
# Packages PR. changesets/action/version hard-resets to the triggering SHA
# before its script, which would drop that prep, so the dispatch job runs
# `pnpm run version` itself and opens the same PR.
#
# The merge push to release-v* uses changesets/action/select-mode:
#   - pending `.changeset/*.md` → version job opens/updates the Version Packages PR.
#     When @truefoundry/trueforge-sdk moves, scripts/version.mjs mirrors that
#     version into python/trueforge_sdk and rebakes Fern.
#   - none pending + unpublished versions → pack (build/test) + Windows npx smoke
#     in parallel with the from-source image (image waits only on npm view of
#     @truefoundry/trueforge@version; skip image+chart if that version is already
#     on npm). The release builds two images with the same tag: a public image
#     on node:24-slim, and a hardened image on the TrueFoundry private node
#     bases. Local and contributor builds stay on node:24-slim.
#     After both images are pushed, this workflow calls release-chart.yml
#     with this branch, app_version, and image_tag. Helm does not wait on pack.
# After Helm publish, release-chart.yml tags charts/trueforge@<chartVersion>
# on the metadata commit and uploads the trueforge-chart-version artifact.
#
# Auth is GitHub OIDC (no NPM_TOKEN / PYPI_TOKEN). An `_authToken` in user `.npmrc`
# disables pnpm's OIDC exchange, so the npm publish job must not set NPM_TOKEN /
# NODE_AUTH_TOKEN. id-token is granted on the publish jobs and on the image job
# (OIDC into the private registry to pull the hardened bases, and Cosign signing).
name: Version or publish packages

on:
  push:
    branches:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      tfy_chart_version:
        description: 'TrueFoundry chart version: X.Y.Z or X.Y.Z-rc.N'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish that is already talking to npm.
  cancel-in-progress: false

permissions: {}

jobs:
  # Dispatch-only. Push runs take the select-mode path below.
  version-release:
    name: Version packages for TrueFoundry release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.finish.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}

      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare release and version packages
        env:
          TFY_CHART_VERSION: ${{ inputs.tfy_chart_version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          node scripts/prepare-release.mjs
          pnpm run version

      - name: Open and auto-merge Version Packages PR
        id: finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          TFY_CHART_VERSION: ${{ inputs.tfy_chart_version }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "Nothing to version; publishing this branch"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION_BRANCH="changeset-release/${RELEASE_BRANCH}"
          git checkout -B "$VERSION_BRANCH"
          git add -A
          git commit -m "Version Packages"
          git push --force origin "HEAD:${VERSION_BRANCH}"
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$VERSION_BRANCH" --base "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$RELEASE_BRANCH" \
              --head "$VERSION_BRANCH" \
              --title "Version Packages" \
              --body "Versions packages for TrueFoundry chart release ${TFY_CHART_VERSION} on ${RELEASE_BRANCH}. Auto-merge publishes npm, PyPI, the image, and the Helm chart from the merge push."
            EXISTING="$(gh pr view "$VERSION_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          fi
          gh pr merge "$EXISTING" --repo "$GITHUB_REPOSITORY" --merge --auto
          echo "mode=version" >> "$GITHUB_OUTPUT"

      # Same-run publish: pack/publish need a publish plan, and the push-path
      # select-mode job never runs on a dispatch.
      - name: Select Changesets mode
        id: select-mode
        if: steps.finish.outputs.mode == 'publish'
        uses: changesets/action/select-mode@v2

  select-mode:
    name: Select mode
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    # Fern rebake when the sdk version moves.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Full history so `changeset version` can write CHANGELOG from commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must be @v2: @changesets/cli@3 stores applied RC changesets under
      # `.changeset/pre/`; @v1 still expects folder-style `pre/changes.md` and
      # fails with ENOENT right after the Version Packages merge.
      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        with:
          script: pnpm run version
          push-with-git-cli: true

  # Exactly one of select-mode / version-release runs; the other is skipped and
  # reports an empty mode. `!cancelled()` is what stops that skip from cascading.
  pack:
    name: Pack packages
    if: ${{ !cancelled() && (needs.select-mode.outputs.mode == 'publish' || needs.version-release.outputs.mode == 'publish') }}
    needs: [select-mode, version-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test

      # Root build copies FE into packages/trueforge/dist/_frontend; refuse an API-only tarball.
      - name: Verify packaged UI is present
        run: |
          test -f packages/trueforge/dist/cli.js
          test -f packages/trueforge/dist/_frontend/index.html

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id || needs.version-release.outputs.publish-plan-artifact-id }}

  windows-npx-smoke:
    name: Windows npx smoke
    if: ${{ !cancelled() && (needs.select-mode.outputs.mode == 'publish' || needs.version-release.outputs.mode == 'publish') }}
    needs: [select-mode, version-release]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack and boot published CLI
        run: pnpm smoke:npx

  publish:
    name: Publish packages
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url / NODE_AUTH_TOKEN: an `_authToken` in .npmrc disables
          # pnpm's OIDC exchange for npm trusted publishing.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Publish packages
        id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          # Attest source repo + commit on every publish. Trusted publishing
          # already uses OIDC (`id-token: write`); this flag is what changesets
          # / pnpm honor (they do not accept `--provenance`).
          # publishConfig.provenance is true on every public package.
          NPM_CONFIG_PROVENANCE: 'true'

  # Sibling of npm publish (same gates). Skips when pyproject version is already on PyPI.
  publish-python:
    name: Publish Python SDK
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build packaging

      - name: Read version and skip if published
        id: version
        working-directory: python/trueforge_sdk
        run: |
          set -euo pipefail
          VERSION="$(python3 -c '
          import re, pathlib
          from packaging.version import Version
          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text)
          if match is None:
              raise SystemExit("missing version in pyproject.toml")
          print(Version(match.group(1)))
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/trueforge-sdk/${VERSION}/json")"
          if [[ "$code" == "200" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "trueforge-sdk==$VERSION already on PyPI; skipping"
          elif [[ "$code" == "404" ]]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI response HTTP $code for trueforge-sdk==$VERSION" >&2
            exit 1
          fi

      - name: Build distributions
        if: steps.version.outputs.already == 'false'
        working-directory: python/trueforge_sdk
        run: python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/trueforge_sdk/dist

  resolve-image:
    name: Resolve image identity
    if: ${{ !cancelled() && (needs.select-mode.outputs.mode == 'publish' || needs.version-release.outputs.mode == 'publish') }}
    needs: [select-mode, version-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      # "build" or "skip", not true/false. GitHub drops a job output whose
      # value is the string false, which would skip the image builds.
      skip: ${{ steps.resolve.outputs.skip }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve image identity
        id: resolve
        run: |
          set -euo pipefail
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          APP_VERSION=$(node -p "require('./packages/trueforge/package.json').version")
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "undefined" ]] || ! printf '%s' "$APP_VERSION" | grep -Eq "$SEMVER"; then
            echo "app_version '$APP_VERSION' is not a semver-like version" >&2
            exit 1
          fi
          IMAGE_TAG="${APP_VERSION}-$(git rev-parse --short=7 HEAD)"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          set +e
          VIEW_OUT=$(npm view "@truefoundry/trueforge@${APP_VERSION}" version 2>&1)
          VIEW_STATUS=$?
          set -e
          if [[ "$VIEW_STATUS" -eq 0 && -n "$VIEW_OUT" ]]; then
            echo "skip=skip" >> "$GITHUB_OUTPUT"
            echo "@truefoundry/trueforge@$APP_VERSION is already on npm; skipping image and chart"
          elif printf '%s' "$VIEW_OUT" | grep -qiE 'E404|404 Not Found|npm error 404'; then
            echo "skip=build" >> "$GITHUB_OUTPUT"
            echo "@truefoundry/trueforge@$APP_VERSION is not on npm; building image $IMAGE_TAG"
          else
            printf '%s\n' "$VIEW_OUT" >&2
            echo "npm view failed for @truefoundry/trueforge@$APP_VERSION" >&2
            exit 1
          fi

  # Two images, same tag, different Artifactory repos. The public one keeps the
  # Dockerfile's public bases so it stays redistributable; the hardened one is
  # built from Chainguard bases whose licence forbids publishing them, so it
  # only goes to the private repo that TrueFoundry SaaS pulls from.
  build-image-public:
    name: Build and push public server image
    if: needs.resolve-image.outputs.skip == 'build'
    needs: [resolve-image]
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: trueforge
      image_tag: ${{ needs.resolve-image.outputs.image_tag }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
    secrets:
      artifactory_username: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}

  build-image-private:
    name: Build and push hardened server image
    if: needs.resolve-image.outputs.skip == 'build'
    needs: [resolve-image]
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PRIVATE_REPOSITORY }}
      image_artifact_name: trueforge
      image_tag: ${{ needs.resolve-image.outputs.image_tag }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
      # Pull-only credential for the devtest account that helm-charts mirrors the
      # hardened bases into; the image itself still goes to Artifactory.
      enable_private_ecr_pull: true
      private_ecr_pull_registry: 526077812922.dkr.ecr.us-east-1.amazonaws.com
      # Mirror targets from helm-charts scripts/sync-images/images.yaml. Unset
      # variables fall back to those tags; an empty build arg would break FROM.
      image_build_args: |
        BUILD_BASE_IMAGE=${{ vars.TRUEFORGE_NODE_BUILD_BASE_IMAGE || '526077812922.dkr.ecr.us-east-1.amazonaws.com/tfy-internal/node:24-dev' }}
        RUNTIME_BASE_IMAGE=${{ vars.TRUEFORGE_NODE_RUNTIME_BASE_IMAGE || '526077812922.dkr.ecr.us-east-1.amazonaws.com/tfy-internal/node:24' }}
    secrets:
      artifactory_username: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PRIVATE_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PRIVATE_PASSWORD }}
      private_ecr_pull_role_arn: ${{ secrets.AWS_DEVTEST_ECR_IAM_ROLE_ARN }}

  release-chart:
    name: Publish Helm chart
    if: needs.resolve-image.outputs.skip == 'build'
    needs: [resolve-image, build-image-public, build-image-private]
    uses: ./.github/workflows/release-chart.yml
    permissions:
      contents: write
    with:
      branch: ${{ github.ref_name }}
      app_version: ${{ needs.resolve-image.outputs.app_version }}
      image_tag: ${{ needs.resolve-image.outputs.image_tag }}
    secrets: inherit

  # release-chart.yml uploads trueforge-chart-version when it publishes.
  # When the package is already on npm, image and chart are skipped and the
  # chart version already on this commit is the one helm-charts should pin.
  record-chart-version:
    name: Record existing chart version
    if: needs.resolve-image.outputs.skip == 'skip'
    needs: [resolve-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write chart version
        run: |
          set -euo pipefail
          VERSION="$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("charts/trueforge/Chart.yaml", "utf8");
            const match = text.match(/^version:\s*"?([^"\n]+)"?\s*$/m);
            if (match === null) {
              process.stderr.write("charts/trueforge/Chart.yaml is missing version\n");
              process.exit(1);
            }
            process.stdout.write(match[1].trim());
          ')"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/chart-version.txt"
          echo "chart version $VERSION"

      - name: Upload chart version
        uses: actions/upload-artifact@v4
        with:
          name: trueforge-chart-version
          path: ${{ runner.temp }}/chart-version.txt
          retention-days: 5
          if-no-files-found: error

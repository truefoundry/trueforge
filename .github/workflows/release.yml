# npm publish for the four public packages, plus PyPI for python/trueforge_sdk.
#
# npm and PyPI trusted publishers are bound to `release.yml`.
# Do not rename this file without updating every package on npmjs.com and PyPI.
#
# On every push to main, changesets/action/select-mode chooses:
#   - pending `.changeset/*.md` → version job opens/updates the Version Packages PR
#     (install only; that PR is gated by CI.yml). When @truefoundry/trueforge-sdk
#     moves, scripts/version.mjs mirrors that version into python/trueforge_sdk and rebakes Fern.
#   - none pending + unpublished versions → pack (build/test) + Windows npx smoke,
#     then npm publish and PyPI publish in parallel
# Merge the Version Packages PR to publish. There is no separate publish Action
# and no `v*` tag trigger.
#
# Auth is GitHub OIDC (no NPM_TOKEN / PYPI_TOKEN). An `_authToken` in user `.npmrc`
# disables pnpm's OIDC exchange, so the npm publish job must not set NPM_TOKEN /
# NODE_AUTH_TOKEN. id-token is granted only on the publish jobs.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish that is already talking to npm.
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    # Fern rebake when the sdk version moves.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Full history so `changeset version` can write CHANGELOG from commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must be @v2: @changesets/cli@3 stores applied RC changesets under
      # `.changeset/pre/`; @v1 still expects folder-style `pre/changes.md` and
      # fails with ENOENT right after the Version Packages merge.
      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        with:
          script: pnpm run version
          push-with-git-cli: true

  pack:
    name: Pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test

      # Root build copies FE into packages/trueforge/dist/_frontend; refuse an API-only tarball.
      - name: Verify packaged UI is present
        run: |
          test -f packages/trueforge/dist/cli.js
          test -f packages/trueforge/dist/_frontend/index.html

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  windows-npx-smoke:
    name: Windows npx smoke
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack and boot published CLI
        run: pnpm smoke:npx

  publish:
    name: Publish packages
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trueforge_published: ${{ steps.trueforge.outputs.published }}
      trueforge_version: ${{ steps.trueforge.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url / NODE_AUTH_TOKEN: an `_authToken` in .npmrc disables
          # pnpm's OIDC exchange for npm trusted publishing.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Publish packages
        id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          # Attest source repo + commit on every publish. Trusted publishing
          # already uses OIDC (`id-token: write`); this flag is what changesets
          # / pnpm honor (they do not accept `--provenance`).
          # publishConfig.provenance is true on every public package.
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Detect @truefoundry/trueforge publish
        id: trueforge
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PACKAGES_KEBAB: ${{ steps.publish.outputs['published-packages'] }}
          PACKAGES_CAMEL: ${{ steps.publish.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISHED:-}" != "true" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PACKAGES="${PACKAGES_KEBAB:-${PACKAGES_CAMEL:-[]}}"
          VERSION=$(printf '%s' "$PACKAGES" | python3 -c '
          import json,sys
          pkgs=json.load(sys.stdin)
          for p in pkgs:
            if p.get("name")=="@truefoundry/trueforge":
              print(p["version"])
              break
          ')
          if [[ -n "$VERSION" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Published @truefoundry/trueforge@$VERSION"
            sleep 30
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "@truefoundry/trueforge was not in this publish set"
          fi

  # Sibling of npm publish (same gates). Skips when pyproject version is already on PyPI.
  publish-python:
    name: Publish Python SDK
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version and skip if published
        id: version
        working-directory: python/trueforge_sdk
        run: |
          set -euo pipefail
          python -m pip install --upgrade packaging
          # Canonical project name + PEP 440 form (0.1.0-rc.1 → 0.1.0rc1). curl -L
          # follows Warehouse redirects from underscore aliases.
          VERSION="$(python3 -c '
          import re, pathlib
          from packaging.version import Version
          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text)
          if match is None:
              raise SystemExit("missing version in pyproject.toml")
          print(Version(match.group(1)))
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/trueforge-sdk/${VERSION}/json")"
          if [[ "$code" == "200" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "trueforge-sdk==$VERSION already on PyPI; skipping"
          elif [[ "$code" == "404" ]]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI response HTTP $code for trueforge-sdk==$VERSION" >&2
            exit 1
          fi

      - name: Build distributions
        if: steps.version.outputs.already == 'false'
        working-directory: python/trueforge_sdk
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/trueforge_sdk/dist

  # Same commit as this publish run (GITHUB_SHA). A workflow_dispatch --ref SHA
  # is rejected: the dispatch API only accepts a branch or tag name (HTTP 422).
  build-and-prepare-chart-release:
    name: Build and prepare chart release
    needs: publish
    if: needs.publish.outputs.trueforge_published == 'true'
    uses: ./.github/workflows/build-and-prepare-chart-release.yml
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    secrets: inherit
    with:
      app_version: ${{ needs.publish.outputs.trueforge_version }}
      update_app_version: true

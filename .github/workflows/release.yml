# npm publish for the four public packages, plus PyPI for python/trueforge_sdk.
#
# npm and PyPI trusted publishers are bound to this filename (`release.yml`).
# Do not rename it without updating every package on npmjs.com and PyPI.
#
# On every push to main, changesets/action/select-mode chooses:
#   - pending `.changeset/*.md` → version job opens/updates the Version Packages PR
#     (install only; that PR is gated by CI.yml). When @truefoundry/trueforge-sdk
#     moves, scripts/version.mjs mirrors that version into python/trueforge_sdk and rebakes Fern.
#   - none pending + unpublished versions → pack (build/test) + Windows npx smoke,
#     then npm publish, PyPI publish, and the from-source image in parallel.
#     After the image is pushed, this workflow calls release-chart.yml with
#     branch main, app_version, and image_tag. Helm does not wait on npm.
# Merge the Version Packages PR to publish. After Helm publish, release-chart.yml
# tags charts/trueforge@<chartVersion> on the metadata commit.
#
# Auth is GitHub OIDC (no NPM_TOKEN / PYPI_TOKEN). An `_authToken` in user `.npmrc`
# disables pnpm's OIDC exchange, so the npm publish job must not set NPM_TOKEN /
# NODE_AUTH_TOKEN. id-token is granted only on the publish jobs.
name: Version or publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish that is already talking to npm.
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    # Fern rebake when the sdk version moves.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Full history so `changeset version` can write CHANGELOG from commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must be @v2: @changesets/cli@3 stores applied RC changesets under
      # `.changeset/pre/`; @v1 still expects folder-style `pre/changes.md` and
      # fails with ENOENT right after the Version Packages merge.
      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        with:
          script: pnpm run version
          push-with-git-cli: true

  pack:
    name: Pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      app_version: ${{ steps.image.outputs.app_version }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test

      # Root build copies FE into packages/trueforge/dist/_frontend; refuse an API-only tarball.
      - name: Verify packaged UI is present
        run: |
          test -f packages/trueforge/dist/cli.js
          test -f packages/trueforge/dist/_frontend/index.html

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

      - name: Resolve image identity
        id: image
        run: |
          set -euo pipefail
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          APP_VERSION=$(node -p "require('./packages/trueforge/package.json').version")
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "undefined" ]] || ! printf '%s' "$APP_VERSION" | grep -Eq "$SEMVER"; then
            echo "app_version '$APP_VERSION' is not a semver-like version" >&2
            exit 1
          fi
          IMAGE_TAG="${APP_VERSION}-$(git rev-parse --short=7 HEAD)"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved app_version=$APP_VERSION image_tag=$IMAGE_TAG"

  windows-npx-smoke:
    name: Windows npx smoke
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack and boot published CLI
        run: pnpm smoke:npx

  publish:
    name: Publish packages
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url / NODE_AUTH_TOKEN: an `_authToken` in .npmrc disables
          # pnpm's OIDC exchange for npm trusted publishing.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Publish packages
        id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          # Attest source repo + commit on every publish. Trusted publishing
          # already uses OIDC (`id-token: write`); this flag is what changesets
          # / pnpm honor (they do not accept `--provenance`).
          # publishConfig.provenance is true on every public package.
          NPM_CONFIG_PROVENANCE: 'true'

  # Sibling of npm publish (same gates). Skips when pyproject version is already on PyPI.
  publish-python:
    name: Publish Python SDK
    needs: [pack, windows-npx-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build packaging

      - name: Read version and skip if published
        id: version
        working-directory: python/trueforge_sdk
        run: |
          set -euo pipefail
          VERSION="$(python3 -c '
          import re, pathlib
          from packaging.version import Version
          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text)
          if match is None:
              raise SystemExit("missing version in pyproject.toml")
          print(Version(match.group(1)))
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/trueforge-sdk/${VERSION}/json")"
          if [[ "$code" == "200" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "trueforge-sdk==$VERSION already on PyPI; skipping"
          elif [[ "$code" == "404" ]]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI response HTTP $code for trueforge-sdk==$VERSION" >&2
            exit 1
          fi

      - name: Build distributions
        if: steps.version.outputs.already == 'false'
        working-directory: python/trueforge_sdk
        run: python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/trueforge_sdk/dist

  build-image:
    name: Build and push server image
    needs: [pack, windows-npx-smoke]
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: trueforge
      image_tag: ${{ needs.pack.outputs.image_tag }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
    secrets:
      artifactory_username: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}

  release-chart:
    name: Publish Helm chart
    needs: [pack, build-image]
    uses: ./.github/workflows/release-chart.yml
    permissions:
      contents: write
    with:
      branch: main
      app_version: ${{ needs.pack.outputs.app_version }}
      image_tag: ${{ needs.pack.outputs.image_tag }}
    secrets: inherit

name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads pnpm version from root packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Guard: git tag must match @truefoundry/utils-core (library is the version authority).
      # npm publishes what's in package.json, not the tag name. @truefoundry/utils may
      # use an independent version; bump it in the same release PR when the app changes.
      - name: Verify tag matches utils-core version
        working-directory: packages/harness
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/harness ($PKG_VERSION)"
            exit 1
          fi

      # Library first: utils pins workspace:* → this concrete version on publish.
      # Prereleases (e.g. 0.1.9-rc.1) pass --tag explicitly; first preid → dist-tag (rc).
      # --no-git-checks: this job checks out a tag (detached HEAD), so pnpm's default
      # "current branch is main/master" check would otherwise always fail here.
      - name: Publish @truefoundry/utils-core
        working-directory: packages/harness
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            echo "Publishing $VERSION with --tag $TAG"
            pnpm publish --access public --tag "$TAG" --no-git-checks
          else
            echo "Publishing $VERSION (latest)"
            pnpm publish --access public --no-git-checks
          fi
        # TODO(oss): add --provenance once the repo is public. Do NOT add it now:
        # provenance publicly attests the source repo and commit.

      # TODO: Publish @truefoundry/utils

      # # Root build copies FE into packages/server/dist/_frontend; refuse an API-only tarball.
      # - name: Verify packaged UI is present
      #   run: |
      #     test -f packages/server/dist/cli.js
      #     test -f packages/server/dist/_frontend/index.html

      # App + CLI from package root (dist/ includes dist/_frontend/).
      # pnpm publish rewrites workspace:* deps to the utils-core version just published.

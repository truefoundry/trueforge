# npm publish for the four public packages.
#
# Filename is load-bearing: npm trusted publishers are bound to `release.yml`.
# Do not rename this file without updating every package on npmjs.com.
#
# On every push to main, changesets/action does one of:
#   - pending `.changeset/*.md` → open/update the Version Packages PR
#     (install only; that PR is gated by CI.yml)
#   - none pending → build, test, then `pnpm release`
# Merge the Version Packages PR to publish. There is no separate publish Action
# and no `v*` tag trigger.
#
# Auth is GitHub OIDC (no NPM_TOKEN). An `_authToken` in user `.npmrc` disables
# pnpm's OIDC exchange, so this job must not set NPM_TOKEN / NODE_AUTH_TOKEN.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish that is already talking to npm.
  cancel-in-progress: false

permissions:
  contents: write # Version Packages branch + optional GitHub Releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Fern rebake when the sdk version moves, or build+test on publish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `changeset version` can write CHANGELOG from commits.
          fetch-depth: 0
          # Named branch, not a detached SHA: `pnpm publish` git-checks require
          # HEAD to be on `main` (the old tag-push job needed --no-git-checks).
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # No registry-url / NODE_AUTH_TOKEN: an `_authToken` in .npmrc disables
          # pnpm's OIDC exchange for npm trusted publishing.

      - run: pnpm install --frozen-lockfile

      # Same rule changesets/action uses: any `.changeset/*.md` except README.
      - id: pending
        name: Detect pending changesets
        run: |
          pending=false
          shopt -s nullglob
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = README.md ] && continue
            pending=true
            break
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - if: steps.pending.outputs.pending != 'true'
        run: pnpm build
      - if: steps.pending.outputs.pending != 'true'
        run: pnpm test

      # Root build copies FE into packages/server/dist/_frontend; refuse an API-only tarball.
      - if: steps.pending.outputs.pending != 'true'
        name: Verify packaged UI is present
        run: |
          test -f packages/server/dist/cli.js
          test -f packages/server/dist/_frontend/index.html

      # Must be @v2: @changesets/cli@3 stores applied RC changesets under
      # `.changeset/pre/`; @v1 still expects folder-style `pre/changes.md` and
      # fails with ENOENT right after the Version Packages merge.
      - name: Create Version Packages PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          create-github-releases: true
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO(oss): set NPM_CONFIG_PROVENANCE once the repo is public. Do NOT
          # set it now: provenance publicly attests the source repo and commit.
          # publishConfig.provenance is false on every public package.

name: Release image and Helm chart

# Manually dispatch to build and push the server image (tagged with the commit
# SHA), stamp that SHA into the Helm chart, package it, and push it to the
# JFrog public OCI Helm repo.
on:
  workflow_dispatch:

# One release at a time so the chart push cannot race.
concurrency:
  group: release-image-and-chart
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # TODO: Re-enable this when we want to derive the version from the release tag.
  # Derive the version from the release tag; it is the single source of truth for
  # the image tag and the chart version/appVersion.
  # prepare:
  #   name: Resolve release version
  #   runs-on: ubuntu-latest
  #   outputs:
  #     version: ${{ steps.version.outputs.version }}
  #   steps:
  #     - name: Resolve version
  #       id: version
  #       env:
  #         TAG: ${{ github.event.release.tag_name }}
  #       run: |
  #         set -euo pipefail
  #         VERSION="${TAG#v}"
  #         if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
  #           echo "Release tag '$TAG' is not a semver vX.Y.Z tag" >&2
  #           exit 1
  #         fi
  #         echo "Releasing version $VERSION"
  #         echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Build and push the server image (API + UI) via the shared reusable workflow.
  build:
    name: Build and push server image
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: truefoundry-utils
      image_tag: ${{ github.sha }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64,linux/arm64
      # The chart pulls the server image from JFrog (values.yaml image.repository),
      # so JFrog is the only publish target; public ECR stays off.
      enable_jfrog: true
      enable_public_ecr: false
    secrets:
      artifactory_username: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_PASSWORD }}

  # Stamp the commit SHA into the chart, then package and publish it.
  release-chart:
    name: Package and publish Helm chart
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Helm requires SemVer for Chart.yaml version; prerelease form keeps the
      # commit SHA while remaining packageable. Image tag stays the raw SHA.
      VERSION: 0.0.0-${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}
      CHART_DIR: charts/truefoundry-utils
      HELM_REGISTRY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      HELM_REGISTRY_USERNAME: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_USERNAME }}
      HELM_REGISTRY_PASSWORD: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_PASSWORD }}
      HELM_CHART_REPOSITORY: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REPOSITORY }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Stamp version into chart
        run: |
          set -euo pipefail
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(IMAGE_TAG)' "$CHART_DIR/Chart.yaml"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$CHART_DIR/values.yaml"
          echo "Stamped chart version=$VERSION image.tag=$IMAGE_TAG"

      - name: Helm registry login
        run: |
          helm registry login -u "$HELM_REGISTRY_USERNAME" -p "$HELM_REGISTRY_PASSWORD" "$HELM_REGISTRY_URL"

      # Fetch the postgresql/redis subcharts from the public Bitnami OCI archive,
      # pinned by Chart.lock. The archive is public (no auth); the images those
      # subcharts run are separately mirrored to JFrog via values.yaml.
      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Package and push chart
        run: |
          set -euo pipefail
          CHART_NAME=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          helm package "$CHART_DIR" --destination dist
          PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"
          echo "Pushing $PACKAGE to oci://$HELM_CHART_REPOSITORY"
          helm push "$PACKAGE" "oci://$HELM_CHART_REPOSITORY"

      - name: Print image URI
        env:
          IMAGE_URI: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}/truefoundry-utils:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Pushed image URI: $IMAGE_URI"
          echo "### Server image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

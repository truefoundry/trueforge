name: Sync devtest pin on custom runners

on:
  workflow_call:
    inputs:
      sha:
        description: trueforge SHA to pin
        required: true
        type: string
      branch:
        description: Branch name written into the deployment manifests
        required: true
        type: string

permissions: {}

jobs:
  guard:
    name: Assert caller
    runs-on:
      group: public-runner-group
      labels: "gh-pb-runners-2c"
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out caller assert
        uses: actions/checkout@v7
        with:
          repository: truefoundry/trueforge
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/actions/assert-custom-runner-caller

      - name: Assert caller
        uses: ./.github/actions/assert-custom-runner-caller
        with:
          allowed_workflows: |
            .github/workflows/deploy-devtest.yml
          job_workflow_ref: ${{ job.workflow_ref }}
          reusable_ref: truefoundry/trueforge/.github/workflows/custom-runners/deploy-devtest.yml@refs/heads/main

  work:
    name: Pin SHA and push
    needs: [guard]
    runs-on:
      group: public-runner-group
      labels: "gh-pb-runners-2c"
    environment: github-write
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}
          permission-contents: write
          owner: truefoundry
          repositories: trueforge-devtest-deployment

      - uses: actions/checkout@v7
        with:
          repository: truefoundry/trueforge-devtest-deployment
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Pin trueforge SHA and push
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          for f in trueforge.truefoundry.yaml trueforge-controller.truefoundry.yaml trueforge-clone-tfy-sandbox.truefoundry.yaml; do
            yq -i '
              .image.build_source.ref = strenv(SHA) |
              .image.build_source.branch_name = strenv(BRANCH)
            ' "$f"
          done

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add trueforge.truefoundry.yaml trueforge-controller.truefoundry.yaml trueforge-clone-tfy-sandbox.truefoundry.yaml
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::devtest pin left files outside the three deployment manifests"
            git status --porcelain
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Already pinned at $SHA"
            exit 0
          fi
          git commit -m "chore: pin trueforge@${SHA}"
          git push
          echo "Pinned trueforge@\`$SHA\` on main" >> "$GITHUB_STEP_SUMMARY"

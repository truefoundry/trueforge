name: Push sandbox image

# PR: docker build only. main/dispatch: push :<sha>, then pin SANDBOX_IMAGE_URI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/trueforge-core/scripts/sandbox/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/trueforge-core/scripts/sandbox/**'

concurrency:
  # github.ref (not event_name): push and dispatch on main share a group so they
  # cannot pin in parallel. Do not cancel an in-flight JFrog push.
  group: push-sandbox-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build sandbox image (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build \
            --platform linux/amd64 \
            -f packages/trueforge-core/scripts/sandbox/sandbox.Dockerfile \
            packages/trueforge-core/scripts/sandbox

  build:
    name: Build and push sandbox image
    if: github.event_name != 'pull_request'
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: trueforge-sandbox
      image_tag: ${{ github.sha }}
      image_context: packages/trueforge-core/scripts/sandbox
      dockerfile_path: packages/trueforge-core/scripts/sandbox/sandbox.Dockerfile
      # Dockerfile downloads linux-amd64 helm/nats binaries only.
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
    secrets:
      artifactory_username: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}

  print-uri:
    name: Print pushed image URI
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - env:
          IMAGE_URI: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}/trueforge-sandbox:${{ github.sha }}
        run: |
          echo "Pushed image URI: $IMAGE_URI"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

  pin:
    name: Open SANDBOX_IMAGE_URI pin PR
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      IMAGE_URI: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}/trueforge-sandbox:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Write SANDBOX_IMAGE_URI
        id: pin-uri
        run: |
          python3 <<'PY'
          import os, re
          from pathlib import Path

          uri = os.environ["IMAGE_URI"]
          if not re.fullmatch(r"[A-Za-z0-9._:/-]+", uri):
              raise SystemExit(f"refusing IMAGE_URI: {uri!r}")

          path = Path("packages/trueforge-core/src/core/sandbox/sandboxImage.ts")
          text = path.read_text()
          match = re.search(r"export const SANDBOX_IMAGE_URI = '([^']+)';", text)
          changed = match is None or match.group(1) != uri
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"changed={'true' if changed else 'false'}\n")
          if not changed:
              print(f"already pinned to {uri}")
              raise SystemExit(0)
          path.write_text(
              "/** Release-owned sandbox image URI; rewritten by push-sandbox-image.yml. */\n"
              f"export const SANDBOX_IMAGE_URI = '{uri}';\n"
          )
          PY

      - if: steps.pin-uri.outputs.changed == 'true'
        run: bash scripts/changeset-sandbox-image.sh

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release-sandbox-image
          base: main
          commit-message: 'chore: pin sandbox image ${{ github.sha }}'
          title: 'chore: pin sandbox image ${{ github.sha }}'
          body: |
            Pushed `${{ env.IMAGE_URI }}`. Merge so `release.yml` can publish the pin.
            Existing tenants stay on `build_metadata`.
          add-paths: |
            packages/trueforge-core/src/core/sandbox/sandboxImage.ts
            .changeset

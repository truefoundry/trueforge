name: Build Node 22 sandbox image (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push Node 22 sandbox image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: packages/trueforge-core/scripts/sandbox
          file: packages/trueforge-core/scripts/sandbox/sandbox.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/andersonvitaease/trueforge-sandbox:node22-20260910
            ghcr.io/andersonvitaease/trueforge-sandbox:${{ github.sha }}

      - name: Report image reference and digest
        run: |
          echo "IMAGE=ghcr.io/andersonvitaease/trueforge-sandbox:node22-20260910"
          echo "IMAGE_SHA_TAG=ghcr.io/andersonvitaease/trueforge-sandbox:${{ github.sha }}"
          echo "IMAGE_DIGEST=${{ steps.image.outputs.digest }}"

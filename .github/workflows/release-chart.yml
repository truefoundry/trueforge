name: Publish Helm chart

# Publishes the Helm chart for an image that already exists in the registry.
# Does not build images: release.yml builds {appVersion}-{shortSha} and then
# calls this workflow with (branch, app_version, image_tag).
#
# Steps: resolve the next chart version from Chart.yaml on origin/<branch>, write
# appVersion / image.tag / version, lint, package, push OCI, commit those files
# to that branch, then tag charts/trueforge@<chartVersion> on that commit.
#
# Manual runs: `gh workflow run release-chart.yml --ref <workflow-file-ref>`.
# --ref is the workflow file GitHub runs (branch or tag, not a SHA).
# `branch` is the git branch that receives Chart.yaml / values.yaml.
# Empty app_version / image_tag default to package.json and
# {appVersion}-{shortSha} on origin/<branch>.
on:
  workflow_call:
    inputs:
      branch:
        description: Git branch that receives the Chart.yaml / values.yaml commit
        required: true
        type: string
      app_version:
        description: Application version written to Chart.yaml appVersion
        required: true
        type: string
      image_tag:
        description: Image tag already pushed to the registry, written to values.yaml image.tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch that receives the Chart.yaml / values.yaml commit
        required: true
        type: string
        default: main
      app_version:
        description: App version (empty = packages/trueforge/package.json on that branch)
        required: false
        type: string
      image_tag:
        description: Existing image tag (empty = <app_version>-<shortSha> of that branch)
        required: false
        type: string

permissions: {}

jobs:
  publish-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so it also applies when this workflow is called from release.yml.
    concurrency:
      group: release-chart-${{ inputs.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CHART_DIR: charts/trueforge
      HELM_REGISTRY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      HELM_CHART_REPOSITORY: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REPOSITORY }}
    steps:
      # App token: GITHUB_TOKEN often cannot push to a protected branch.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Checkout branch and resolve versions
        id: resolve
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BRANCH="$INPUT_BRANCH"
          if [[ -z "$BRANCH" || "$BRANCH" == refs/* || "$BRANCH" == *..* ]] ||
            ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "branch '$BRANCH' is not a valid git branch name" >&2
            exit 1
          fi
          git fetch origin "$BRANCH"
          git checkout -B chart-release "origin/${BRANCH}"

          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          APP_VERSION="$INPUT_APP_VERSION"
          if [[ -z "$APP_VERSION" ]]; then
            APP_VERSION=$(node -p "require('./packages/trueforge/package.json').version")
          fi
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "undefined" ]] || ! printf '%s' "$APP_VERSION" | grep -Eq "$SEMVER"; then
            echo "app_version '$APP_VERSION' is not a semver-like version" >&2
            exit 1
          fi
          IMAGE_TAG="$INPUT_IMAGE_TAG"
          if [[ -z "$IMAGE_TAG" ]]; then
            # Peeled commit SHA: GITHUB_SHA on an annotated tag is the tag object.
            IMAGE_TAG="${APP_VERSION}-$(git rev-parse --short=7 HEAD)"
          fi
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "image_tag '$IMAGE_TAG' is not a valid OCI tag" >&2
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved branch=$BRANCH app_version=$APP_VERSION image_tag=$IMAGE_TAG"

      - name: Update chart metadata
        id: chart
        env:
          APP_VERSION: ${{ steps.resolve.outputs.app_version }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          CURRENT=$(yq -r '.version' "$CHART_DIR/Chart.yaml")
          VERSION=$(bash scripts/resolve-chart-version.sh "$CURRENT" "$APP_VERSION")
          export VERSION IMAGE_TAG APP_VERSION
          yq -i '.version = strenv(VERSION)' "$CHART_DIR/Chart.yaml"
          yq -i '.appVersion = strenv(APP_VERSION)' "$CHART_DIR/Chart.yaml"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$CHART_DIR/values.yaml"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version=$VERSION appVersion=$APP_VERSION image.tag=$IMAGE_TAG"

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: helm lint "$CHART_DIR" --values "$CHART_DIR/ci/lint-values.yaml"

      - name: Helm registry login
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}
        run: |
          printf '%s' "$HELM_REGISTRY_PASSWORD" \
            | helm registry login -u "$HELM_REGISTRY_USERNAME" --password-stdin "$HELM_REGISTRY_URL"

      - name: Package and push chart
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          CHART_NAME=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist
          PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"
          echo "Pushing $PACKAGE to oci://$HELM_CHART_REPOSITORY"
          set +e
          PUSH_OUT=$(helm push "$PACKAGE" "oci://$HELM_CHART_REPOSITORY" 2>&1)
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "$PUSH_OUT"
          if [[ "$PUSH_STATUS" -ne 0 ]]; then
            # A retry after a failed branch push must still be able to commit and tag.
            if printf '%s' "$PUSH_OUT" | grep -qiE 'already exists|409'; then
              echo "Chart $VERSION already in the registry; continuing so $BRANCH can catch up"
            else
              exit "$PUSH_STATUS"
            fi
          fi
          {
            echo "### Helm chart"
            echo "Pushed \`oci://${HELM_CHART_REPOSITORY}/${CHART_NAME}:${VERSION}\`"
            echo "Image tag \`${IMAGE_TAG}\`"
            echo "Branch \`${BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit chart metadata and tag
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          APP_VERSION: ${{ steps.resolve.outputs.app_version }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_metadata() {
            export VERSION IMAGE_TAG APP_VERSION
            yq -i '.version = strenv(VERSION)' "$CHART_DIR/Chart.yaml"
            yq -i '.appVersion = strenv(APP_VERSION)' "$CHART_DIR/Chart.yaml"
            yq -i '.image.tag = strenv(IMAGE_TAG)' "$CHART_DIR/values.yaml"
          }

          # Tag only after the metadata commit is on the branch, so the tag
          # points at the commit that holds the published Chart.yaml / values.yaml.
          tag_chart() {
            TAG="charts/trueforge@${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG already exists"
              return 0
            fi
            git tag -a "$TAG" -m "Helm chart ${VERSION} (image ${IMAGE_TAG})"
            git push origin "$TAG"
            echo "Pushed $TAG at $(git rev-parse HEAD)"
          }

          for attempt in 1 2 3; do
            git add "$CHART_DIR/Chart.yaml" "$CHART_DIR/values.yaml"
            if git diff --staged --quiet; then
              echo "Chart metadata already matches $VERSION"
              tag_chart
              exit 0
            fi
            git commit -m "release(chart): ${VERSION}"
            if git push origin "HEAD:${BRANCH}"; then
              tag_chart
              exit 0
            fi
            echo "Push to $BRANCH failed (attempt $attempt); replay metadata onto origin/${BRANCH}"
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            apply_metadata
          done
          echo "Could not fast-forward chart metadata onto $BRANCH" >&2
          exit 1

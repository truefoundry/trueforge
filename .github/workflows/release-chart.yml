name: Publish Helm chart

# Manual dispatch. Release runs call custom-runners/publish-chart.yml directly.
# `gh workflow run release-chart.yml --ref <workflow-file-ref>`.
# --ref is the workflow file GitHub runs (branch or tag, not a SHA).
# `branch` is the git branch that receives Chart.yaml / values.yaml.
# Empty app_version / image_tag keep the values already on origin/<branch>.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch that receives the Chart.yaml / values.yaml commit
        required: true
        type: string
        default: main
      chart_version:
        description: 'Chart version to publish, verbatim: X.Y.Z or X.Y.Z-rc.N'
        required: true
        type: string
      app_version:
        description: App version (empty = Chart.yaml appVersion on that branch)
        required: false
        type: string
      image_tag:
        description: Existing image tag (empty = values.yaml image.tag on that branch)
        required: false
        type: string
      dry_run: # DRY-RUN (temporary)
        description: 'Dry run: skip the git tags and the OCI push'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  publish-chart:
    name: Publish Helm chart
    uses: ./.github/workflows/custom-runners/publish-chart.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      checkout_ref: ${{ github.sha }}
      branch: ${{ inputs.branch }}
      chart_version: ${{ inputs.chart_version }}
      app_version: ${{ inputs.app_version }}
      image_tag: ${{ inputs.image_tag }}
      dry_run: ${{ inputs.dry_run }}

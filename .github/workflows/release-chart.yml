name: Build server image and publish Helm chart

# Starts when release.yml dispatches this workflow (App token). Builds the
# from-source image, publishes the Helm chart, commits metadata to main, then
# tags charts/trueforge@<chartVersion> on that commit.
#
# workflow_dispatch is also for manual rebuilds. Do not use `gh workflow run --ref
# $GITHUB_SHA`: the dispatch API only accepts a branch or tag name (HTTP 422).
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App version for the image tag (empty = packages/trueforge/package.json)
        required: false
        type: string

concurrency:
  group: release-image-and-chart
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve app version and image tag
        id: resolve
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/trueforge/package.json').version")
          if [[ -n "${INPUT_APP_VERSION}" ]]; then
            APP_VERSION="$INPUT_APP_VERSION"
          else
            APP_VERSION="$PKG_VERSION"
          fi
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "undefined" ]]; then
            echo "Could not resolve APP_VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "APP_VERSION '$APP_VERSION' is not a semver-like version" >&2
            exit 1
          fi
          # Peel annotated tags: GITHUB_SHA is the tag object, not the commit.
          COMMIT_SHA=$(git rev-parse --verify HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE_TAG="${APP_VERSION}-${SHORT_SHA}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=$APP_VERSION IMAGE_TAG=$IMAGE_TAG commit=$COMMIT_SHA (package.json=$PKG_VERSION)"

  build:
    name: Build and push server image
    needs: [resolve]
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: trueforge
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
    secrets:
      artifactory_username: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}

  publish-chart:
    name: Publish Helm chart
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHART_DIR: charts/trueforge
      HELM_REGISTRY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      HELM_CHART_REPOSITORY: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REPOSITORY }}
    steps:
      # App token: GITHUB_TOKEN cannot start workflows and often cannot push
      # to protected main. Chart files are replayed onto origin/main so a tag
      # or dispatch ref never force-updates main.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_ID }}
          private-key: ${{ secrets.TRUEFORGE_GENERATE_SDK_APP_PRIVATE_KEY }}

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Update chart metadata on main
        id: chart
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B chart-release origin/main
          CURRENT=$(yq -r '.version' charts/trueforge/Chart.yaml)
          VERSION=$(bash scripts/resolve-chart-version.sh "$CURRENT" "$APP_VERSION")
          export VERSION IMAGE_TAG APP_VERSION
          yq -i '.version = strenv(VERSION)' charts/trueforge/Chart.yaml
          yq -i '.appVersion = strenv(APP_VERSION)' charts/trueforge/Chart.yaml
          yq -i '.image.tag = strenv(IMAGE_TAG)' charts/trueforge/values.yaml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version=$VERSION appVersion=$APP_VERSION image.tag=$IMAGE_TAG"

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: helm lint "$CHART_DIR" --values charts/trueforge/ci/lint-values.yaml

      - name: Helm registry login
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}
        run: |
          printf '%s' "$HELM_REGISTRY_PASSWORD" \
            | helm registry login -u "$HELM_REGISTRY_USERNAME" --password-stdin "$HELM_REGISTRY_URL"

      - name: Package and push chart
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          CHART_NAME=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist
          PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"
          echo "Pushing $PACKAGE to oci://$HELM_CHART_REPOSITORY"
          set +e
          PUSH_OUT=$(helm push "$PACKAGE" "oci://$HELM_CHART_REPOSITORY" 2>&1)
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "$PUSH_OUT"
          if [[ "$PUSH_STATUS" -ne 0 ]]; then
            if printf '%s' "$PUSH_OUT" | grep -qiE 'already exists|409'; then
              echo "Chart $VERSION already in the registry; continuing so main can catch up"
            else
              exit "$PUSH_STATUS"
            fi
          fi
          {
            echo "### Helm chart"
            echo "Pushed \`oci://${HELM_CHART_REPOSITORY}/${CHART_NAME}:${VERSION}\`"
            echo "Image tag \`${{ needs.resolve.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit chart metadata to main
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_metadata() {
            export VERSION IMAGE_TAG APP_VERSION
            yq -i '.version = strenv(VERSION)' charts/trueforge/Chart.yaml
            yq -i '.appVersion = strenv(APP_VERSION)' charts/trueforge/Chart.yaml
            yq -i '.image.tag = strenv(IMAGE_TAG)' charts/trueforge/values.yaml
          }

          tag_chart() {
            TAG="charts/trueforge@${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG already exists"
              return 0
            fi
            git tag -a "$TAG" -m "Helm chart ${VERSION}"
            git push origin "$TAG"
            echo "Pushed $TAG"
          }

          for attempt in 1 2 3; do
            git add charts/trueforge/Chart.yaml charts/trueforge/values.yaml
            if git diff --staged --quiet; then
              echo "Chart metadata already matches $VERSION"
              tag_chart
              exit 0
            fi
            git commit -m "release(chart): ${VERSION}"
            if git push origin HEAD:main; then
              tag_chart
              exit 0
            fi
            echo "Push to main failed (attempt $attempt); replay metadata onto origin/main"
            git fetch origin main
            git reset --hard origin/main
            apply_metadata
          done
          echo "Could not fast-forward chart metadata onto main" >&2
          exit 1

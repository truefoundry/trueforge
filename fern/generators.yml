# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
#
# Generates the TypeScript SDK into packages/sdk from the OpenAPI document that
# packages/server emits. `openapi/openapi.json` is written by
# `pnpm --filter @truefoundry/server openapi:write` and committed, so a Fern run
# never needs the server running.
readme:
  introduction: >
    TypeScript client for the TrueFoundry agent harness server: a self-hosted
    runtime that executes agent turns and streams them over Server-Sent Events.


    The harness server has no built-in authentication, so point the client at
    your own deployment's base URL.
  # `POST /v1/sessions/{sessionId}/turns` is the streaming create endpoint. Fern
  # keys the readme-endpoint cache on the stream flag, so the string form (which
  # defaults stream=false) misses this entry and fails with "Endpoint not found".
  defaultEndpoint:
    method: POST
    path: /v1/sessions/{sessionId}/turns
    stream: true
api:
  specs:
    - openapi: openapi/openapi.json
      settings:
        title-as-schema-name: false
        prefer-undiscriminated-unions-with-literals: true
        only-include-referenced-schemas: true
        type-dates-as-strings: true
        object-query-parameters: false
        idiomatic-request-names: true
        respect-nullable-schemas: true
        wrap-references-to-nullable-in-optional: false
        coerce-optional-schemas-to-nullable: false
        inline-path-parameters: false
        coerce-enums-to-literals: true
        respect-forward-compatible-enums: true
groups:
  # Writes generated files straight into packages/sdk. `local-file-system` output
  # cannot be combined with a `github` block, so the workflow commits the result
  # itself. The npm package name comes from `packageJson.name` for this output
  # mode; there is no `output.package-name` field to set.
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.85.0
        output:
          location: local-file-system
          path: ../packages/sdk
        config:
          packageJson:
            name: trueharness
          allowExtraFields: true
          allowCustomFetcher: true
          enableInlineTypes: false
          fetchSupport: native
          fileResponseType: binary-response
          formDataSupport: Node18
          includeApiReference: true
          inlineFileProperties: true
          inlinePathParameters: true
          naming:
            namespace: TrueHarness
            client: TrueHarness
          noSerdeLayer: false
          omitUndefined: true
          retainOriginalCasing: false
          skipResponseValidation: true
          streamType: web
          useDefaultRequestParameterValues: true
        smart-casing: true
